name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # the tests never load a model, so skip torch -- it is most of the download
      - run: uv sync --locked --python 3.12 --no-install-package torch

      - run: uv run --no-sync python -m unittest discover tests -v
