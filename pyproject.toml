[project]
name = "second-brain"
version = "0.1.0"
description = "A local question-answering layer over your own commits and calendar."
readme = "README.md"
requires-python = ">=3.12"

# what everything needs, on every OS: sync, retrieval, answers, the local window
dependencies = [
    "fastapi>=0.115",
    "google-api-python-client>=2.198",
    "google-auth>=2.56",
    "google-auth-oauthlib>=1.4",
    "keyring>=25",
    "numpy>=2.5",
    "openai>=2.52",
    "platformdirs>=4",
    "pydantic>=2.13",
    "PyGithub>=2.9",
    "pyperclip>=1.11",
    "python-dateutil>=2.9",
    "python-dotenv>=1.2",
    # embeddings: MiniLM through ONNX Runtime, no torch
    "huggingface-hub>=0.24",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# asking by voice: the microphone and speech-to-text
voice = [
    "faster-whisper>=1.2",
    "sounddevice>=0.5",
]
# the macOS menubar app. rumps pulls in the one pyobjc framework it uses, rather
# than all ~170 that the old requirements.txt pinned
menubar = [
    "rumps>=0.4; sys_platform == 'darwin'",
]
dev = [
    "pillow>=12",
]

[tool.uv]
# run from the repo root as `python -m src....`; there is nothing to install
package = false
